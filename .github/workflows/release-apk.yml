name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ví dụ: 0.2.0)'
        required: true
      version_code:
        description: 'Version code (để trống để tự tính từ SemVer)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed arm64-v8a Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version Name & strictly increasing Version Code
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VNAME="${{ github.event.inputs.version_name }}"
            VCODE="${{ github.event.inputs.version_code }}"
          else
            VNAME="${GITHUB_REF_NAME#v}"
            VCODE=""
          fi

          VNAME="${VNAME#v}"
          VNAME="${VNAME#V}"

          if [ -z "$VCODE" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VNAME%%-*}"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            VCODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          fi

          if [ "$VCODE" -lt 2 ]; then
            VCODE=2
          fi

          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VNAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release v$VNAME (versionCode=$VCODE)"

      - name: Decode Release Keystore from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ENZII_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ENZII_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENZII_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ENZII_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Thiếu GitHub Secrets (ENZII_KEYSTORE_BASE64, ENZII_KEYSTORE_PASSWORD, ENZII_KEY_ALIAS, ENZII_KEY_PASSWORD). Vui lòng thêm đủ 4 secret trong Settings -> Secrets and variables -> Actions trước khi phát hành."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/enzii-release.jks"
          chmod 600 "$RUNNER_TEMP/enzii-release.jks"

      - name: Run Unit Tests & Build Signed Release APK
        env:
          ENZII_KEYSTORE_PATH: ${{ runner.temp }}/enzii-release.jks
          ENZII_KEYSTORE_PASSWORD: ${{ secrets.ENZII_KEYSTORE_PASSWORD }}
          ENZII_KEY_ALIAS: ${{ secrets.ENZII_KEY_ALIAS }}
          ENZII_KEY_PASSWORD: ${{ secrets.ENZII_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PenziiVersionCode=${{ steps.ver.outputs.version_code }} \
            -PenziiVersionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon --console=plain

      - name: Prepare Release APK Artifact
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Không tìm thấy $SRC (hãy kiểm tra lại secrets ký số)."
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "dist/EnziiDict-v${{ steps.ver.outputs.version_name }}-arm64-v8a.apk"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: "Enzii Dict v${{ steps.ver.outputs.version_name }}"
          generate_release_notes: true
          files: dist/EnziiDict-v${{ steps.ver.outputs.version_name }}-arm64-v8a.apk
